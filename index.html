<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#e8eedc" />
    <meta name="description" content="在柔和的三维小院中漫步，探索小屋、菜园与水井。" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>家园漫游</title>
    <style>
      body{margin:0;background:#f3f1e5;color:#40543f;font-family:system-ui,sans-serif}
      .loading{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:28px}
      [hidden]{display:none!important}
    </style>
  </head>
  <body>
    <div id="app">
      <main id="loading" class="loading boot-loading" data-phase="boot">
        <div class="launch-landscape" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="launch-content">
          <span class="launch-emblem" aria-hidden="true"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 9-8 9 8M5 10v10h14V10M10 20v-6h4v6"/></svg></span>
          <p class="launch-eyebrow">A LITTLE PLACE TO GROW</p>
          <section id="loading-panel" aria-labelledby="loading-title">
            <h1 id="loading-title">准备一段小小的旅程</h1>
            <p id="loading-description" role="status">正在加载基础界面…</p>
            <div id="loading-meter">
              <div class="loading-caption"><span id="loading-stage">基础加载</span><output id="loading-percent" aria-hidden="true">0%</output></div>
              <progress id="loading-progress" max="100" value="0" aria-label="基础加载进度">0%</progress>
            </div>
            <button id="retry-loading" class="primary-button" hidden>重新加载</button>
          </section>
          <section id="menu-panel" aria-labelledby="menu-title" hidden>
            <h1 id="menu-title">家园漫游</h1>
            <p>一个小小的家园，等你来走走。</p>
            <div class="menu-actions">
              <button id="continue-save" class="primary-button" disabled>继续游戏</button>
              <button id="start-game" class="primary-button">开始游戏</button>
            </div>
            <p id="menu-save-status" class="menu-save-status" role="status"></p>
            <p class="menu-hint">点击探索 · 拖动地图 · 自由漫游</p>
          </section>
          <section id="preparation-panel" aria-labelledby="preparation-title" hidden>
            <div class="preparation-heading"><p class="eyebrow">一段新的旅程</p><h1 id="preparation-title" tabindex="-1">准备你的家园</h1></div>
            <form id="game-setup-form">
              <div class="preparation-scroll">
                <fieldset class="mode-options"><legend>游戏模式</legend>
                  <label class="setup-choice"><input type="radio" name="mode" value="story" checked><span><strong>故事模式</strong><small>跟随章节发展家园，遇见旅人，打通商路。</small></span></label>
                  <label class="setup-choice"><input type="radio" name="mode" value="free"><span><strong>自由模式</strong><small>自由建设、探索与战斗，自己决定下一步。</small></span></label>
                </fieldset>
                <fieldset class="difficulty-options"><legend>游戏难度</legend>
                  <label class="setup-choice"><input type="radio" name="difficulty" value="relaxed"><span>轻松</span></label>
                  <label class="setup-choice"><input type="radio" name="difficulty" value="standard" checked><span>标准</span></label>
                  <label class="setup-choice"><input type="radio" name="difficulty" value="challenging"><span>挑战</span></label>
                </fieldset>
                <p id="difficulty-description"></p>
                <label class="home-name-label" for="home-name">家园名称<input id="home-name" name="homeName" type="text" maxlength="24" placeholder="溪谷家园" autocomplete="off" value="溪谷家园"></label>
                <div class="setup-summary" aria-live="polite"><strong id="setup-goal"></strong><p id="setup-summary"></p></div>
              </div>
              <div class="preparation-actions"><button id="preparation-back" type="button" class="primary-button secondary-button">返回</button><button id="enter-world" type="submit" class="primary-button">进入世界</button></div>
            </form>
          </section>
          <section id="exit-panel" aria-labelledby="exit-title" hidden>
            <h1 id="exit-title">已退出游戏</h1>
            <p>进度已保存，可以关闭此页面。</p>
            <button id="exit-to-menu" class="primary-button">返回主菜单</button>
          </section>
        </div>
        <p class="launch-footer">dev</p>
      </main>
      <dialog id="new-game-dialog" class="paper-dialog" aria-labelledby="new-game-title" aria-describedby="new-game-description">
        <h2 id="new-game-title">开始新的家园？</h2>
        <p id="new-game-description" class="dialog-intro">开始新游戏会覆盖此浏览器中原有的经营进度。取消可以保留进度并继续游戏。</p>
        <form method="dialog" class="menu-actions">
          <button class="primary-button secondary-button" value="cancel">取消</button>
          <button class="primary-button" value="new">开始新游戏</button>
        </form>
      </dialog>
      <div id="game-page" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
